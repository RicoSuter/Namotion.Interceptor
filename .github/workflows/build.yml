name: publish
on:
  workflow_dispatch: # Allow running the workflow manually from the GitHub UI
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - '**'
  release:
    types:
      - published

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_VERSION: 10.0.x
  NUGET_DIRECTORY: ${{ github.workspace }}/nuget

defaults:
  run:
    shell: pwsh

jobs:
  # Determine which integration test jobs should run based on changed files
  # For non-PR events (push to master, release), always run all tests
  changes:
    runs-on: ubuntu-latest
    outputs:
      homeblaze: ${{ github.event_name != 'pull_request' || steps.filter.outputs.homeblaze == 'true' }}
      nugetplugins: ${{ github.event_name != 'pull_request' || steps.filter.outputs.nugetplugins == 'true' }}
      opcua: ${{ github.event_name != 'pull_request' || steps.filter.outputs.opcua == 'true' }}
      websocket: ${{ github.event_name != 'pull_request' || steps.filter.outputs.websocket == 'true' }}
      mqtt: ${{ github.event_name != 'pull_request' || steps.filter.outputs.mqtt == 'true' }}
      modbus: ${{ github.event_name != 'pull_request' || steps.filter.outputs.modbus == 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            shared: &shared
              - 'src/Namotion.Interceptor/**'
              - 'src/Namotion.Interceptor.Generator/**'
              - 'src/Namotion.Interceptor.Tracking/**'
              - 'src/Namotion.Interceptor.Registry/**'
              - 'src/Namotion.Interceptor.Connectors/**'
              - 'src/Namotion.Interceptor.Dynamic/**'
              # Test-only references: not used by the connectors, only by their test projects.
              - 'src/Namotion.Interceptor.Testing/**'
              - 'src/Namotion.Interceptor.Hosting/**'
              - 'src/Namotion.Interceptor.Validation/**'
              - 'src/Namotion.Interceptor.AspNetCore/**'
            homeblaze:
              - 'src/HomeBlaze/**'
              - 'src/Namotion.Interceptor.Expressions/**'
              - 'src/Directory.Packages.props'
              - 'src/Directory.Build.props'
              - 'src/Directory.Build.targets'
              - '.github/workflows/build.yml'
            nugetplugins:
              - 'src/HomeBlaze/Namotion.NuGet.Plugins/**'
              - 'src/HomeBlaze/Namotion.NuGet.Plugins.Tests/**'
              - 'src/HomeBlaze/MyCompany.Abstractions/**'
              - 'src/HomeBlaze/MyCompany.SamplePlugin*/**'
              - 'src/HomeBlaze/HomeBlaze.Plugins/**'
              - 'src/HomeBlaze/HomeBlaze.Plugins.Tests/**'
            opcua:
              - *shared
              - 'src/Namotion.Interceptor.OpcUa*/**'
              - 'src/HomeBlaze/*OpcUa*/**'
            websocket:
              - *shared
              - 'src/Namotion.Interceptor.WebSocket*/**'
            mqtt:
              - *shared
              - 'src/Namotion.Interceptor.Mqtt*/**'
            modbus:
              - *shared
              - 'src/Namotion.Interceptor.Modbus*/**'
              - 'src/HomeBlaze/Namotion.Devices.Luxtronik*/**'

  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build src/Namotion.Interceptor.slnx --configuration Release

      - name: Run tests (excluding integration tests)
        run: |
          dotnet test src/Namotion.Interceptor.slnx `
            --configuration Release `
            --no-build `
            --filter "Category!=Integration" `
            --results-directory ./TestResults `
            --collect:"XPlat Code Coverage" `
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload raw coverage file
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-coverage
          path: '**/TestResults/**/coverage.cobertura.xml'
          if-no-files-found: error

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate HTML coverage report
        run: |
          reportgenerator `
            -reports:"**/TestResults/**/coverage.cobertura.xml" `
            -targetdir:"coverage-report" `
            -reporttypes:Html

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v7
        with:
          name: html-coverage-report
          path: coverage-report

  test-homeblaze-integration:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.homeblaze == 'true'
    # Splits the E2E tests round-robin across the jobs; one more entry adds a job.
    strategy:
      fail-fast: false
      matrix:
        shard: [ 0, 1, 2 ]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build src/HomeBlaze/HomeBlaze.E2E.Tests --configuration Release

      - name: Read Playwright version
        id: playwright
        run: |
          $version = (Select-Xml -Path src/Directory.Packages.props -XPath "//PackageVersion[@Include='Microsoft.Playwright']").Node.Version
          if (-not $version) { throw "Microsoft.Playwright is not in src/Directory.Packages.props" }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.VERSION }}

      # The E2E tests only launch Chromium, and a cached browser is not downloaded again. The runner image already has its
      # libraries, so --with-deps would only add fonts the tests do not need, from a mirror that can take minutes.
      - name: Install Playwright browsers
        run: pwsh src/HomeBlaze/HomeBlaze.E2E.Tests/bin/Release/net10.0/playwright.ps1 install chromium

      # Theory rows are listed with their arguments; the part before "(" is the full name, so a theory stays in one job.
      - name: Select the tests of this shard
        id: shard
        run: |
          $listing = dotnet test src/HomeBlaze/HomeBlaze.E2E.Tests --configuration Release --no-build --list-tests --filter "Category=Integration"
          $names = @($listing | Where-Object { $_ -match '^    \S' } | ForEach-Object { $_.Trim().Split('(')[0] } | Sort-Object -Unique -CaseSensitive)
          if ($LASTEXITCODE -ne 0 -or $names.Count -eq 0) { $listing; throw "Listing the tests failed" }
          $index = ${{ strategy.job-index }}
          $count = ${{ strategy.job-total }}
          $share = @(for ($position = $index; $position -lt $names.Count; $position += $count) { "FullyQualifiedName=$($names[$position])" })
          Write-Host "Shard $index of $count runs $($share.Count) of $($names.Count) tests"
          "filter=$($share -join '|')" >> $env:GITHUB_OUTPUT

      - name: Run HomeBlaze integration tests
        if: steps.shard.outputs.filter != ''
        run: |
          dotnet test src/HomeBlaze/HomeBlaze.E2E.Tests `
            --configuration Release `
            --no-build `
            --filter "${{ steps.shard.outputs.filter }}" `
            --results-directory ./TestResults `
            --collect:"XPlat Code Coverage" `
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload HomeBlaze integration test coverage
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-coverage-homeblaze-integration-${{ strategy.job-index }}
          path: '**/TestResults/**/coverage.cobertura.xml'
          if-no-files-found: warn

  test-nugetplugins-integration:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.nugetplugins == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build src/Namotion.Interceptor.slnx --configuration Release

      - name: Run NuGet plugins integration tests
        run: |
          dotnet test src/HomeBlaze/Namotion.NuGet.Plugins.Tests `
            --configuration Release `
            --no-build `
            --filter "Category=Integration" `
            --results-directory ./TestResults `
            --collect:"XPlat Code Coverage" `
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload NuGet plugins integration test coverage
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-coverage-nugetplugins-integration
          path: '**/TestResults/**/coverage.cobertura.xml'
          if-no-files-found: warn

  test-opcua-integration:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.opcua == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build src/Namotion.Interceptor.slnx --configuration Release

      - name: Run OPC UA integration tests
        run: |
          dotnet test src/Namotion.Interceptor.OpcUa.Tests `
            --configuration Release `
            --no-build `
            --filter "Category=Integration" `
            --results-directory ./TestResults `
            --collect:"XPlat Code Coverage" `
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload integration test coverage
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-coverage-opcua-integration
          path: '**/TestResults/**/coverage.cobertura.xml'
          if-no-files-found: warn

  test-websocket-integration:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.websocket == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build src/Namotion.Interceptor.slnx --configuration Release

      - name: Run WebSocket integration tests
        run: |
          dotnet test src/Namotion.Interceptor.WebSocket.Tests `
            --configuration Release `
            --no-build `
            --filter "Category=Integration" `
            --results-directory ./TestResults `
            --collect:"XPlat Code Coverage" `
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload integration test coverage
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-coverage-websocket-integration
          path: '**/TestResults/**/coverage.cobertura.xml'
          if-no-files-found: warn

  test-mqtt-integration:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mqtt == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build src/Namotion.Interceptor.slnx --configuration Release

      - name: Run MQTT integration tests
        run: |
          dotnet test src/Namotion.Interceptor.Mqtt.Tests `
            --configuration Release `
            --no-build `
            --filter "Category=Integration" `
            --results-directory ./TestResults `
            --collect:"XPlat Code Coverage" `
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload MQTT integration test coverage
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-coverage-mqtt-integration
          path: '**/TestResults/**/coverage.cobertura.xml'
          if-no-files-found: warn

  test-modbus-integration:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.modbus == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build src/Namotion.Interceptor.slnx --configuration Release

      - name: Run Modbus integration tests
        run: |
          dotnet test src/Namotion.Interceptor.Modbus.Tests `
            --configuration Release `
            --no-build `
            --filter "Category=Integration" `
            --results-directory ./TestResults `
            --collect:"XPlat Code Coverage" `
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Run Luxtronik integration tests
        run: |
          dotnet test src/HomeBlaze/Namotion.Devices.Luxtronik.Tests `
            --configuration Release `
            --no-build `
            --filter "Category=Integration" `
            --results-directory ./TestResults `
            --collect:"XPlat Code Coverage" `
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload Modbus and Luxtronik integration test coverage
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-coverage-modbus-integration
          path: '**/TestResults/**/coverage.cobertura.xml'
          if-no-files-found: warn

  container-build:
    timeout-minutes: 20
    needs: [ changes ]
    if: needs.changes.outputs.homeblaze == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build image archive
        run: |
          dotnet publish src/HomeBlaze/HomeBlaze/HomeBlaze.csproj -c Release -r linux-x64 /t:PublishContainer `
            -p:ContainerRuntimeIdentifiers= -p:ContainerImageTag=smoke `
            -p:ContainerArchiveOutputPath=${{ runner.temp }}/homeblaze.tar.gz `
            -p:LibraryPackageVersion=9.9.9 `
            -p:InformationalVersion=edge -p:BuildTime=2000-01-01T00:00:00Z `
            -p:ContinuousIntegrationBuild=true

      - name: Smoke test image
        run: |
          docker load -i "${{ runner.temp }}/homeblaze.tar.gz"
          $data = New-Item -ItemType Directory -Path (Join-Path "${{ runner.temp }}" "homeblaze-data")
          docker run -d --name homeblaze -p 8080:8080 -v "$($data.FullName):/data" homeblaze:smoke
          $healthy = $false
          for ($attempt = 0; $attempt -lt 60 -and -not $healthy; $attempt++) {
            try { $healthy = (Invoke-WebRequest -Uri http://localhost:8080/health -UseBasicParsing).StatusCode -eq 200 } catch { $healthy = $false }
            if (-not $healthy) { Start-Sleep -Seconds 2 }
          }
          docker logs homeblaze
          if (-not $healthy) { throw "HomeBlaze did not become healthy" }
          $deps = docker exec homeblaze cat /app/HomeBlaze.deps.json
          if ($LASTEXITCODE -ne 0) { throw "Could not read deps.json from the container" }
          if (-not ($deps -match '"Namotion.Interceptor/9\.9\.9"')) { throw "deps.json does not report the library package version" }
          if (-not ($deps -match '"HomeBlaze.Abstractions/1\.0\.0"')) { throw "deps.json does not report the pinned HomeBlaze version" }
          foreach ($path in @("Root.json", "Files/Plugins.json", "Files/Servers/SqliteHistory.json", "Files/Docs")) {
            if (-not (Test-Path (Join-Path $data.FullName $path))) { throw "Missing seeded path $path" }
          }
          $historyCreated = $false
          for ($attempt = 0; $attempt -lt 30 -and -not $historyCreated; $attempt++) {
            $historyCreated = Test-Path (Join-Path $data.FullName "History/Sqlite")
            if (-not $historyCreated) { Start-Sleep -Seconds 1 }
          }
          if (-not $historyCreated) { throw "SQLite history folder was not created" }

      - name: Check build metadata
        run: |
          # The Installation subject reads its build from HomeBlaze.Installation.dll, not HomeBlaze.dll, so both carry the metadata.
          foreach ($name in @("HomeBlaze.dll", "HomeBlaze.Installation.dll")) {
            docker cp "homeblaze:/app/$name" "${{ runner.temp }}/$name"
            if ($LASTEXITCODE -ne 0) { throw "Could not copy $name from the container" }
            # Attribute arguments are UTF-8 strings in the metadata blob heap, so a text search finds them.
            $text = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes("${{ runner.temp }}/$name"))
            if (-not $text.Contains("Namotion.Build.Time")) { throw "$name has no build time" }
            if (-not $text.Contains("2000-01-01T00:00:00Z")) { throw "$name has another build time" }
            if ($text -notmatch 'edge\+[0-9a-f]{40}') { throw "$name's informational version has no commit" }
            if ($text -match 'edge\+[0-9a-f]+\.[0-9a-f]') { throw "$name's informational version has a doubled commit" }
          }
          # The container-publish job reads this label to decide whether edge moves.
          $revision = docker inspect homeblaze:smoke --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          if ($revision -ne (git rev-parse HEAD)) { throw "The image revision label '$revision' is not the built commit" }

      - name: Build arm64 image archive
        run: |
          dotnet publish src/HomeBlaze/HomeBlaze/HomeBlaze.csproj -c Release -r linux-arm64 /t:PublishContainer `
            -p:ContainerRuntimeIdentifiers= -p:ContainerImageTag=smoke-arm64 `
            -p:ContainerArchiveOutputPath=${{ runner.temp }}/homeblaze-arm64.tar.gz

  container-publish:
    timeout-minutes: 30
    # Forks cannot push to this package.
    if: github.repository_owner == 'RicoSuter' && (github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))
    # Serializes publishing per ref, so the edge commit the Compute tags step reads cannot change before this run pushes.
    # A newly queued run cancels the pending one, so a burst of merges can skip a commit until the next push.
    concurrency:
      group: container-publish-${{ github.ref }}
      cancel-in-progress: false
    needs: [ container-build, test, test-homeblaze-integration, test-nugetplugins-integration, test-opcua-integration, test-websocket-integration, test-mqtt-integration, test-modbus-integration ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          # Moving tags never move back to an older commit or release, so re-running an older run is safe.
          if ($env:GITHUB_EVENT_NAME -eq "release") {
            $version = $env:RELEASE_TAG -replace '^v', ''
            $tags = $imageTag = $version
            # Pre-releases must not move latest or the minor tag.
            if ($env:RELEASE_PRERELEASE -ne "true") {
              $latestReleaseTag = gh release view --repo $env:GITHUB_REPOSITORY --json tagName -q .tagName
              if ($LASTEXITCODE -ne 0) { throw "Could not read the latest release" }
              if ($latestReleaseTag -eq $env:RELEASE_TAG) {
                $parts = $version.Split('.')
                $tags = "$tags;$($parts[0]).$($parts[1]);latest"
              }
            }
            $informationalVersion = $version
            $libraryVersion = $version
            $buildTag = $env:RELEASE_TAG
            $branch = ""
          } else {
            $short = $env:GITHUB_SHA.Substring(0, 7)
            $tags = $imageTag = "sha-$short"
            # Edge follows every newer green commit, so a failed run of a later commit does not hold it back.
            $masterHead = git ls-remote origin refs/heads/master
            if ($LASTEXITCODE -ne 0) { throw "Could not read the master head" }
            $moveEdge = $masterHead -like "$($env:GITHUB_SHA)*"
            if (-not $moveEdge) {
              # A missing tool, edge image or unknown commit keeps edge instead of failing the publish, with a warning.
              $PSNativeCommandUseErrorActionPreference = $false
              if (Get-Command skopeo -ErrorAction SilentlyContinue) {
                $edgeCommit = (skopeo --command-timeout 1m inspect --no-tags docker://ghcr.io/ricosuter/homeblaze:edge | ConvertFrom-Json).Labels.'org.opencontainers.image.revision'
              }
              $comparison = if ($edgeCommit -match '^[0-9a-f]{40}$') { gh api "repos/$($env:GITHUB_REPOSITORY)/compare/$edgeCommit...$($env:GITHUB_SHA)" --jq .status }
              $moveEdge = $comparison -in "ahead", "identical"
              # Behind is an older run of a commit that edge has passed already.
              if (-not $moveEdge -and $comparison -ne "behind") {
                Write-Host "::warning::Edge stays: no comparison of the edge commit '$edgeCommit' with this commit, got '$comparison'"
              }
            }
            Write-Host "Move edge: $moveEdge, edge commit: '$edgeCommit', comparison: '$comparison'"
            if ($moveEdge) { $tags = "edge;$tags" }
            # The SDK appends +<commit> itself.
            $informationalVersion = "edge"
            $libraryVersion = (gh release view --repo $env:GITHUB_REPOSITORY --json tagName -q .tagName) -replace '^v', ''
            if ($LASTEXITCODE -ne 0) { throw "Could not read the latest release" }
            $buildTag = ""
            $branch = $env:GITHUB_REF_NAME
          }
          $commitDate = git log -1 --format=%cI
          if ($LASTEXITCODE -ne 0) { throw "Could not read the commit date" }
          echo "TAGS=$tags" >> $env:GITHUB_OUTPUT
          echo "IMAGE_TAG=$imageTag" >> $env:GITHUB_OUTPUT
          echo "INFORMATIONAL_VERSION=$informationalVersion" >> $env:GITHUB_OUTPUT
          echo "LIBRARY_VERSION=$libraryVersion" >> $env:GITHUB_OUTPUT
          echo "BUILD_TAG=$buildTag" >> $env:GITHUB_OUTPUT
          echo "SOURCE_BRANCH=$branch" >> $env:GITHUB_OUTPUT
          echo "SOURCE_COMMIT_DATE=$commitDate" >> $env:GITHUB_OUTPUT
          echo "BUILD_TIME=$([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ', [Globalization.CultureInfo]::InvariantCulture))" >> $env:GITHUB_OUTPUT
          echo "BUILD_RUN_URL=$($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:GITHUB_RUN_ID)" >> $env:GITHUB_OUTPUT

      # Tags go through an environment variable because MSBuild splits semicolons on the command line.
      # Version is not overridden: HomeBlaze pins it to 1.0.0 because plugins bind by assembly version.
      # LibraryPackageVersion only sets the library versions in deps.json.
      - name: Publish multi-arch image
        env:
          ContainerImageTags: ${{ steps.tags.outputs.TAGS }}
        run: |
          dotnet publish src/HomeBlaze/HomeBlaze/HomeBlaze.csproj -c Release /t:PublishContainer `
            -p:ContainerRegistry=ghcr.io -p:ContainerRepository=ricosuter/homeblaze `
            -p:InformationalVersion=${{ steps.tags.outputs.INFORMATIONAL_VERSION }} `
            -p:LibraryPackageVersion=${{ steps.tags.outputs.LIBRARY_VERSION }} `
            -p:BuildTag=${{ steps.tags.outputs.BUILD_TAG }} `
            -p:SourceBranch=${{ steps.tags.outputs.SOURCE_BRANCH }} `
            -p:SourceCommitDate=${{ steps.tags.outputs.SOURCE_COMMIT_DATE }} `
            -p:BuildTime=${{ steps.tags.outputs.BUILD_TIME }} `
            -p:BuildRunUrl=${{ steps.tags.outputs.BUILD_RUN_URL }} `
            -p:ContinuousIntegrationBuild=true

      # The Compute tags step of a later run reads this label from edge, and without it keeps edge at the master head.
      - name: Check the revision label of the published image
        env:
          IMAGE_TAG: ${{ steps.tags.outputs.IMAGE_TAG }}
        run: |
          if (-not (Get-Command skopeo -ErrorAction SilentlyContinue)) {
            Write-Host "::warning::skopeo is missing, so the revision label of the published image is not checked"
            exit 0
          }
          foreach ($arch in "amd64", "arm64") {
            $image = skopeo --command-timeout 1m inspect --retry-times 3 --no-tags --override-os linux --override-arch $arch "docker://ghcr.io/ricosuter/homeblaze:$($env:IMAGE_TAG)"
            if ($LASTEXITCODE -ne 0) { throw "Could not inspect the published $arch image" }
            $revision = ($image | ConvertFrom-Json).Labels.'org.opencontainers.image.revision'
            if ($revision -ne $env:GITHUB_SHA) { throw "The $arch image has the revision label '$revision' instead of $($env:GITHUB_SHA)" }
          }

  pack:
    timeout-minutes: 15
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Extract version from tag
        id: version
        run: |
          $version = "${{ github.event.release.tag_name }}" -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Compute build metadata
        id: build
        run: |
          $commitDate = git log -1 --format=%cI
          if ($LASTEXITCODE -ne 0) { throw "Could not read the commit date" }
          echo "SOURCE_COMMIT_DATE=$commitDate" >> $env:GITHUB_OUTPUT

      # AssemblyVersion stays unchanged so binding is unaffected; only the informational version carries the release.
      - run: |
          dotnet build src/Namotion.Interceptor.slnx --configuration Release `
            -p:InformationalVersion=${{ steps.version.outputs.VERSION }} `
            -p:BuildTag=${{ github.event.release.tag_name }} `
            -p:SourceCommitDate=${{ steps.build.outputs.SOURCE_COMMIT_DATE }} `
            -p:ContinuousIntegrationBuild=true

      - run: dotnet pack src/Namotion.Interceptor.slnx --configuration Release --no-build --output ${{ env.NUGET_DIRECTORY }} -p:PackageVersion=${{ steps.version.outputs.VERSION }}

      - name: Remove non-library packages
        run: Get-ChildItem "${{ env.NUGET_DIRECTORY }}" -Include *.nupkg -Recurse | Where-Object { $_.Name -notlike "Namotion.Interceptor*" } | Remove-Item -Force

      - uses: actions/upload-artifact@v7
        with:
          name: nuget
          if-no-files-found: error
          retention-days: 7
          path: ${{ env.NUGET_DIRECTORY }}/*.nupkg

  validate:
    timeout-minutes: 15
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [ pack ]
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/download-artifact@v8
        with:
          name: nuget
          path: ${{ env.NUGET_DIRECTORY }}

      - name: Install nuget validator
        run: dotnet tool update Meziantou.Framework.NuGetPackageValidation.Tool --global --version 1.0.46

      - name: Validate package
        run: meziantou.validate-nuget-package --excluded-rules IconMustBeSet,ReadmeMustBeSet,Symbols,ProjectUrlMustBeSet (Get-ChildItem "${{ env.NUGET_DIRECTORY }}/*.nupkg")

  deploy:
    timeout-minutes: 15
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [ validate, test, test-homeblaze-integration, test-nugetplugins-integration, test-opcua-integration, test-websocket-integration, test-mqtt-integration, test-modbus-integration ]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget
          path: ${{ env.NUGET_DIRECTORY }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Publish all NuGet packages to NuGet.org
      # Use --skip-duplicate to prevent errors if a package with the same version already exists.
      # If you retry a failed workflow, already published packages will be skipped without error.
      - name: Publish NuGet package
        run: |
          foreach($file in (Get-ChildItem "${{ env.NUGET_DIRECTORY }}" -Recurse -Include *.nupkg)) {
              dotnet nuget push $file --api-key "${{ secrets.NUGET_APIKEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
