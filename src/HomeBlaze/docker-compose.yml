# HomeBlaze self-hosting. Start: docker compose up -d
# Optional services read secrets from .env (see the installation guide): docker compose --profile seq up -d
# HomeBlaze has no login: keep it on a trusted network or behind an authenticating reverse proxy.
services:
  homeblaze:
    image: ghcr.io/ricosuter/homeblaze:latest
    hostname: homeblaze  # stable across recreated containers, so the OPC UA certificates kept in data/OpcUa stay valid
    restart: unless-stopped
    ports:
      - "8080:8080"   # UI and MCP
      - "4840:4840"   # OPC UA server subject
    volumes:
      - ./data:/data  # Root.json, Files/, History/, OpcUa/, DataProtection-Keys/; filled with defaults on first start, Files/Docs is replaced on every start
    environment:
      TZ: Europe/Zurich
      McpServer__Enabled: "true"
      McpServer__ReadOnly: "true"  # set to "false" to let MCP clients write values
      ConnectionStrings__seq: http://seq:5341
    # devices:
    #   - /dev/gpiomem  # Raspberry Pi 3/4 GPIO; Pi 5 is not supported in the container (needs libgpiod)

  updater:
    # Opt-in: lets the Installation subject install updates, see the installation guide. Holds the Docker socket,
    # which gives it root access to the host. Needs COMPOSE_DIR and COMPOSE_PROFILES=updater in .env.
    # Without COMPOSE_DIR the updater finds no data folder and stays inactive.
    image: docker:29-cli@sha256:34507eb5069d8be82c95dd3b6987d4250fd5fee49b82e2509b7d7a7030740d6d
    profiles: [updater]
    restart: unless-stopped
    working_dir: ${COMPOSE_DIR:-/homeblaze-updater-needs-COMPOSE_DIR}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${COMPOSE_DIR:-/homeblaze-updater-needs-COMPOSE_DIR}:${COMPOSE_DIR:-/homeblaze-updater-needs-COMPOSE_DIR}  # same path as on the host, so compose resolves ./data to the host folder
    command:
      - sh
      - -c
      - |
        while true; do
          touch data/.updater-heartbeat
          if [ -f data/.update-request ]; then
            mv data/.update-request data/.update-running
            { docker compose pull homeblaze && docker compose up -d homeblaze; } > data/.update-log 2>&1
            echo $$? > data/.update-result.tmp && mv data/.update-result.tmp data/.update-result
          fi
          sleep 5
        done

  seq:
    image: datalust/seq
    profiles: [seq]
    restart: unless-stopped
    ports:
      - "5341:80"
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:-}  # from .env; initial "admin" password, Seq asks for a new one at the first login
    volumes:
      - seq-data:/data

volumes:
  seq-data:
