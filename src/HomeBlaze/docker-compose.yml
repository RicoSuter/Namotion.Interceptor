# HomeBlaze self-hosting. Start: docker compose up -d
# Optional services read secrets from .env (see the installation guide): docker compose --profile seq up -d
# HomeBlaze requires signing in: the first start creates the user "admin" with an empty password, set one at once.
# Lost password: docker compose run --rm homeblaze --reset-admin
services:
  homeblaze:
    image: ghcr.io/ricosuter/homeblaze:latest
    restart: unless-stopped
    ports:
      - "8080:8080"   # UI and MCP
      - "4840:4840"   # OPC UA server subject
    volumes:
      - ./data:/data  # Root.json, Files/, History/, OpcUa/, DataProtection-Keys/, authentication.db (users and roles, back it up); filled with defaults on first start, Files/Docs is replaced on every start
    environment:
      TZ: Europe/Zurich
      McpServer__Enabled: "true"
      ConnectionStrings__seq: http://seq:5341
    # devices:
    #   - /dev/gpiomem  # Raspberry Pi 3/4 GPIO; Pi 5 is not supported in the container (needs libgpiod)

  seq:
    image: datalust/seq
    profiles: [seq]
    restart: unless-stopped
    ports:
      - "5341:80"
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:-}  # from .env; initial "admin" password, Seq asks for a new one at the first login
    volumes:
      - seq-data:/data

volumes:
  seq-data:
