# Status: auto-approved (the user auto-approved both gates for this run)
# The episode id must equal the episode folder name.
episode: 01-tracking
title: Tracking
voice: kokoro:am_michael
tempo: 1.32
chapters:
  - id: hook
    title: Tracking
    beats:
      - id: hook-title
        narration: Your coffee machine model changes all the time. How does everything that depends on it keep up?
        visual: Chapter card "Tracking" with the kicker "Every change, observed"; the title letters rise in over the gradient wash.
        components: [ChapterCard]
      - id: hook-stream
        narration: With tracking, every write becomes a change you can observe. On the left the boiler heats up, on the right each change streams in.
        visual: The card exits; two browser windows spring in, the machine page left and the change stream right, and play the heat clip; the camera eases from the left window to the right one as rows slide in.
        components: [BrowserFrame, Camera]
        demo: heat
      - id: hook-derived
        narration: Values like ready and the status line recalculate themselves, and publish a change only when they really change.
        visual: The heat clip continues; the camera leans toward the three counters at the top of the stream, then pulls back as the status headline counts up.
        components: [BrowserFrame, Camera]
        demo: heat
      - id: hook-stuck
        narration: And when a brew fails halfway, a transaction keeps the machine from getting stuck, like the one on the left.
        visual: The windows cross fade into the stuck clip, two machine pages side by side; the left one turns to "Brewing Ristretto" at 0 bar while the right one stays Ready; the camera moves to the left headline.
        components: [BrowserFrame, Camera]
        demo: stuck
      - id: hook-promise
        narration: In the next ten minutes, you will see derived properties, change streams, lifecycle events and transactions.
        visual: The camera pulls back; the windows shrink and four topic pills spring in below them one after another.
        components: [BrowserFrame, Card, Camera]
        demo: stuck
  - id: setup
    title: Setup
    beats:
      - id: setup-title
        narration: First, a quick look at the machine and the setup.
        visual: Chapter card "Setup" with the kicker Chapter 1.
        components: [ChapterCard]
      - id: setup-tree
        narration: The coffee machine is a tree of tracked objects, with a boiler, a pump, a water tank, a bean hopper and its recipes.
        visual: The card exits; the machine node springs in at the top and its five parts arrive beneath it one after another, with edges drawing down.
        components: [FlowDiagram]
      - id: setup-simulator
        narration: A simulator writes to it ten times a second. It heats the boiler, and builds pump pressure while it brews.
        visual: A simulator node slides in at the left; particles travel from the simulator into the boiler and the pump while the camera leans toward them.
        components: [FlowDiagram, Camera]
      - id: setup-subject
        narration: Each part is a partial class, marked as an interceptor subject, like this pump with its pressure and running flag.
        visual: The tree slides left and fades; a code card springs in and the Pump region types in; the attribute line is focused, then the two partial properties.
        components: [CodeCard, Camera]
        code: {file: ../../domain/Coffee/Pump.cs, region: Pump}
      - id: setup-generated
        narration: The source generator implements those partial properties, so every read and every write passes through the context.
        visual: The two property lines stay bright; a small "generated" pill drops onto them and the camera leans in.
        components: [CodeCard, Card, Camera]
        code: {file: ../../domain/Coffee/Pump.cs, region: Pump}
      - id: setup-context
        narration: Tracking starts with that context. Create one, add full property tracking, and pass it to the machine.
        visual: The card morphs into the Context region of Steps.cs and the tab renames; the WithFullPropertyTracking line is focused.
        components: [CodeCard, Camera]
        code: {file: sample/Steps.cs, region: Context}
      - id: setup-bundle
        narration: That one call bundles four features. Equality checks, derived property detection, change subscriptions, and context inheritance with lifecycle tracking.
        visual: The card slides left; four feature pills spring in to its right one after another, each named in turn, with a connector line from the tracking line.
        components: [CodeCard, Card, Camera]
        code: {file: sample/Steps.cs, region: Context}
      - id: setup-individual
        narration: You can also enable each feature on its own, if you only need some of them.
        visual: The four pills line up in a column and each gets its own small method name, WithEqualityCheck and its siblings, while the camera eases over them.
        components: [CodeCard, Card, Camera]
        code: {file: sample/Steps.cs, region: Context}
      - id: setup-inherit
        narration: Context inheritance hands the context down the tree, so the boiler, the pump and every recipe are tracked too.
        visual: The pills fade; the machine line is focused; the tree returns small on the right and particles run from the machine down to every part.
        components: [CodeCard, FlowDiagram]
        code: {file: sample/Steps.cs, region: Context}
      - id: setup-validation
        narration: This sample also validates data annotations, like the boiler's allowed temperature range. We will need that later.
        visual: The validation line is focused; a pill "85 to 96 °C" springs in beside it and the camera nudges toward it.
        components: [CodeCard, Card, Camera]
        code: {file: sample/Steps.cs, region: Context}
      - id: setup-opt-in
        narration: Transactions are opt in. We add them in the last chapter.
        visual: A dashed placeholder line appears under the validation line with the label "transactions, later", then the camera pulls back to the whole card.
        components: [CodeCard, Card, Camera]
        code: {file: sample/Steps.cs, region: Context}
  - id: derived
    title: Derived properties
    beats:
      - id: derived-title
        narration: Let us start with values that compute themselves.
        visual: Chapter card "Derived properties" with the kicker Chapter 2.
        components: [ChapterCard]
      - id: derived-code
        narration: Ready and status are derived properties. They are plain getters, marked with the derived attribute.
        visual: The card exits; a code card springs in and the Derived region of CoffeeMachine.cs types in; the two Derived attributes are focused.
        components: [CodeCard]
        code: {file: ../../domain/Coffee/CoffeeMachine.cs, region: Derived}
      - id: derived-isready
        narration: Is ready reads the machine state, whether the boiler is hot, and whether the water tank is low.
        visual: The IsReady line is focused and the camera leans in on it; three small read markers pop under State, IsHot and IsLow.
        components: [CodeCard, Camera]
        code: {file: ../../domain/Coffee/CoffeeMachine.cs, region: Derived}
      - id: derived-status
        narration: Status reads even more. It formats the temperature while heating, and the recipe name while brewing.
        visual: The focus moves down to the Status switch; the Heating line and the Brewing line light up in turn while the camera follows.
        components: [CodeCard, Camera]
        code: {file: ../../domain/Coffee/CoffeeMachine.cs, region: Derived}
      - id: derived-no-events
        narration: There are no change events to raise by hand. The getter is the whole definition.
        visual: The camera pulls back to the whole card; the IsReady line pulses once.
        components: [CodeCard, Camera]
        code: {file: ../../domain/Coffee/CoffeeMachine.cs, region: Derived}
      - id: derived-record
        narration: When the getter runs, the library records every property it reads. Those reads become its dependencies.
        visual: The card shrinks to the left; a dependency diagram builds to its right, State, IsHot and IsLow nodes with edges into IsReady.
        components: [CodeCard, FlowDiagram]
        code: {file: ../../domain/Coffee/CoffeeMachine.cs, region: Derived}
      - id: derived-chain
        narration: The boiler's hot flag is derived too, from its temperature and its target. The library follows that chain down to the real properties.
        visual: The code card morphs into the IsHot region of Boiler.cs; Temperature and TargetTemperature nodes grow in front of IsHot and their edges draw.
        components: [CodeCard, FlowDiagram, Camera]
        code: {file: ../../domain/Coffee/Boiler.cs, region: IsHot}
      - id: derived-initial
        narration: Each derived property is evaluated once when its subject joins the context, so its dependencies are known from the start.
        visual: The code card fades; the whole diagram pulses from left to right once, node by node, and the camera centers on it.
        components: [FlowDiagram, Camera]
      - id: derived-ripple
        narration: Now the simulator writes a new temperature. Is hot, ready, and the status recalculate right away.
        visual: A Status node joins on the right; a "Temperature 78.4" chip arrives at the Temperature node; particles ripple along the edges through IsHot into IsReady and Status, which nudge as they arrive.
        components: [FlowDiagram, Card, Camera]
      - id: derived-compare
        narration: Each recalculation compares the result with the last value, and publishes a change only if it differs.
        visual: The Status node gets a small "Heating 78 °C" pill that flips to "Heating 79 °C", while IsReady shows "false" with a muted "no change" tag.
        components: [FlowDiagram, Card]
      - id: derived-across
        narration: A derived property can read anything tracked in the graph, across subjects, like ready reading the boiler and the water tank.
        visual: The IsLow node lights cyan and the IsHot node pink, the subject colors; the camera eases across the diagram from the boiler side to the tank side.
        components: [FlowDiagram, Camera]
      - id: derived-branch
        narration: Dependencies are recorded again on every evaluation. While the machine brews, status only reads the state and the recipe name.
        visual: The diagram gives way to the Derived code card again; the Brewing line of Status is focused while the other branches dim.
        components: [CodeCard, Camera]
        code: {file: ../../domain/Coffee/CoffeeMachine.cs, region: Derived}
      - id: derived-settle
        narration: Under concurrent writes, every derived value settles on what its getter would return once the writes are done.
        visual: The Brewing line stays bright; three write chips from simulator, request and job arrive at the card at once and a "settles" pill springs in as they fade.
        components: [CodeCard, Card, Camera]
        code: {file: ../../domain/Coffee/CoffeeMachine.cs, region: Derived}
      - id: derived-live
        narration: Here is the live sample heating up. The status line counts the degrees, while ready stays false.
        hold: 0.6
        visual: The code card shrinks away; the machine and change stream windows spring in and play the heat clip from the start; the camera leans toward the status headline.
        components: [BrowserFrame, Camera]
        demo: heat
      - id: derived-counts
        narration: Look at the counters. The temperature changes ten times a second, the status once per degree, and ready not at all.
        hold: 0.6
        visual: The camera moves to the three counters; callout pills "10 per second", "once per degree" and "not yet" spring in under them in turn.
        components: [BrowserFrame, Card, Camera]
        demo: heat
      - id: derived-equality
        narration: That is the equality check at work. Writing the same value again publishes nothing, so busy loops do not flood your observers.
        visual: The heat clip continues; an "equal value, no change" pill springs in over the stream window and the camera pulls back slightly.
        components: [BrowserFrame, Card, Camera]
        demo: heat
      - id: derived-ready
        narration: At 92 degrees the boiler counts as hot, and ready flips to true, exactly once.
        hold: 1
        visual: The clip reaches Ready; the camera leans toward the IsReady counter turning to 1 and the new IsReady row at the top of the stream.
        components: [BrowserFrame, Camera]
        demo: heat
  - id: streams
    title: Change streams
    beats:
      - id: streams-title
        narration: So how do you observe all these changes?
        visual: Chapter card "Change streams" with the kicker Chapter 3.
        components: [ChapterCard]
      - id: streams-change
        narration: Every committed write produces a subject property change. It carries the property, the old and the new value, a timestamp and a revision.
        visual: The card exits; a change card springs in titled SubjectPropertyChange, and its five fields slide in one after another with real values from a status change.
        components: [Card]
      - id: streams-values
        narration: Read the values with get old value and get new value, typed to what you expect.
        visual: The old and new value fields of the change card are highlighted in turn, each with a small generic method pill beside it.
        components: [Card, Camera]
      - id: streams-source
        narration: It also records where the value came from, so a value that a connector received is never echoed back to it.
        visual: An origin field slides into the change card with a small source badge; a return arrow starts to draw and dissolves.
        components: [Card]
      - id: streams-channels
        narration: One interceptor publishes each change through three channels. An observable, a queue, and subscriptions to a single property.
        visual: The change card shrinks to the left as a write node; three channel nodes fan out to the right and particles travel to each in turn.
        components: [FlowDiagram]
      - id: streams-observable
        narration: The observable is the most flexible. Subscribe to the context, and you receive every change of every subject in it.
        visual: The diagram fades; a code card springs in and the Observable region of ChangeStream.cs types in; the GetPropertyChangeObservable line is focused.
        components: [CodeCard, Camera]
        code: {file: sample/ChangeStream.cs, region: Observable}
      - id: streams-rx
        narration: It is a Reactive Extensions stream, delivered on a scheduler, so you can filter, buffer or throttle it. The sample filters out the simulator's physics.
        visual: The focus moves to the Where clause and the camera follows; a pill "Temperature, Pressure, Levels" springs in beside it and dims.
        components: [CodeCard, Card, Camera]
        code: {file: sample/ChangeStream.cs, region: Observable}
      - id: streams-ui
        narration: That makes the observable the natural choice for user interfaces and for composing queries.
        visual: The camera pulls back slightly; the Subscribe call is focused and a small "UI" pill springs in.
        components: [CodeCard, Card, Camera]
        code: {file: sample/ChangeStream.cs, region: Observable}
      - id: streams-dispose
        narration: Every subscription returns a handle. Dispose it, and the changes stop.
        visual: The returned subscription is focused; the camera pulls back to the whole card.
        components: [CodeCard, Camera]
        code: {file: sample/ChangeStream.cs, region: Observable}
      - id: streams-brew-click
        narration: Watch the stream while we brew an espresso.
        visual: The code card slides away; the machine and stream windows spring in with the brew clip; the camera leans toward the Espresso button as it is pressed.
        components: [BrowserFrame, Camera]
        demo: brew
      - id: streams-brew-rows
        narration: One brew, six changes, in exactly the order brew wrote them, with the derived ready and status in between.
        hold: 0.6
        visual: The camera moves to the stream window as six rows slide in; small numbers 1 to 6 pop beside the rows.
        components: [BrowserFrame, Card, Camera]
        demo: brew
      - id: streams-brew-step
        narration: Notice the status that reads brewing, without a recipe yet. Observers see every single step, as it happens.
        hold: 0.6
        visual: The camera zooms on the "Ready → Brewing" status row; a pink "no recipe yet" pill springs in beside it.
        components: [BrowserFrame, Card, Camera]
        demo: brew
      - id: streams-brew-done
        narration: The pump builds pressure to 9 bar. When the espresso is done, the simulator counts the cup and returns the machine to idle, and the stream shows that too.
        hold: 1
        visual: The camera pans to the machine window while the pump bar fills to 9 bar, then back to the stream as the finishing rows slide in.
        components: [BrowserFrame, Camera]
        demo: brew
      - id: streams-property
        narration: If you care about one property of one subject, subscribe to just that property.
        visual: The windows shrink away; a code card with the ReadyLog region of MachineHost.cs types in; the selector is focused.
        components: [CodeCard, Camera]
        code: {file: sample/MachineHost.cs, region: ReadyLog}
      - id: streams-scheduler
        narration: This one runs on a scheduler, so a slow callback never delays the write. The inline variant runs inside the setter and must be fast.
        visual: The scheduler argument is focused; two pills "scheduled, after the write" and "inline, inside the setter" spring in beside the card, the second in orange.
        components: [CodeCard, Card, Camera]
        code: {file: sample/MachineHost.cs, region: ReadyLog}
      - id: streams-terminal
        narration: Start the sample, and the subscription logs when each machine becomes ready.
        hold: 0.8
        visual: The code card slides up; a terminal springs in, types the run command and streams the log ending with both machines ready.
        components: [Terminal, Camera]
        terminal: run-sample
      - id: streams-queue
        narration: For a dedicated background worker, there is also a queue. One consumer thread drains it, without Reactive Extensions. Connectors read their outbound changes this way.
        visual: The terminal fades; a code card with the Queue region of Steps.cs types in; the TryDequeue loop is focused.
        components: [CodeCard, Camera]
        code: {file: sample/Steps.cs, region: Queue}
      - id: streams-order
        narration: One caveat for every channel. With several threads writing at once, changes can arrive out of order, so compare the revision, or simply read the property again.
        visual: Two change chips with revisions 41 and 42 slide in beside the card in the wrong order, then swap places; the camera follows.
        components: [CodeCard, Card, Camera]
        code: {file: sample/Steps.cs, region: Queue}
  - id: lifecycle
    title: Lifecycle
    beats:
      - id: lifecycle-title
        narration: Object graphs change too. Let us add a recipe.
        visual: Chapter card "Lifecycle" with the kicker Chapter 4.
        components: [ChapterCard]
      - id: lifecycle-tree
        narration: Recipes are subjects as well. Espresso and lungo hang off the machine's recipes dictionary.
        visual: The card exits; the machine tree builds with a Recipes node and its Espresso and Lungo children beneath it; the camera leans toward the recipes.
        components: [FlowDiagram, Camera]
      - id: lifecycle-code
        narration: This endpoint adds a ristretto. It creates the recipe without a context, and assigns a new dictionary.
        visual: The tree slides left and shrinks; a code card with the AddRecipe region of Program.cs types in on the right; the new Recipe line is focused.
        components: [CodeCard, FlowDiagram, Camera]
        code: {file: sample/Program.cs, region: AddRecipe}
      - id: lifecycle-attach
        narration: On assignment, the library attaches the new recipe to the graph, and it inherits the machine's context.
        visual: A Ristretto node springs in under Recipes and its edge draws; an "attached" pill pops beside it and a context dot travels down from the machine.
        components: [FlowDiagram, Card, Camera]
      - id: lifecycle-tracked
        narration: From now on, its writes are tracked like any other. Remove the last reference, and it is detached again, with everything below it.
        visual: A particle runs from Ristretto up to the machine; then the Ristretto edge turns dashed, the node dims and a "detached" pill replaces "attached", before it returns to normal.
        components: [FlowDiagram, Card, Camera]
      - id: lifecycle-shared
        narration: A subject that two properties point to stays attached until its last reference is gone.
        visual: A second edge draws to the Lungo node from a dashed favorites node; a "2 references" pill appears; one edge fades and the pill turns to "1 reference".
        components: [FlowDiagram, Card]
      - id: lifecycle-events
        narration: You can react to both moments. The lifecycle interceptor raises subject attached and subject detaching.
        visual: The tree fades; the code card morphs into the Lifecycle region of MachineHost.cs; the two event lines are focused in turn.
        components: [CodeCard, Camera]
        code: {file: sample/MachineHost.cs, region: Lifecycle}
      - id: lifecycle-handler
        narration: For services you register up front, implement the lifecycle handler interface instead. It sees every attach and detach, and every reference added or removed.
        visual: The event lines dim; a small ILifecycleHandler card slides in beside the code with four flag pills that light up one after another.
        components: [CodeCard, Card, Camera]
        code: {file: sample/MachineHost.cs, region: Lifecycle}
      - id: lifecycle-live
        narration: In the sample, both events write a row into the change stream. Add the ristretto, and it appears right away.
        hold: 0.6
        visual: The code card slides away; the machine and stream windows spring in and play the recipe clip; the camera leans toward the attached row.
        components: [BrowserFrame, Camera]
        demo: recipe
      - id: lifecycle-button
        narration: The new recipe also shows up as a button, because the page reads the recipes from the model.
        hold: 0.6
        visual: The camera pans to the machine window where the Ristretto button has popped in next to Espresso and Lungo.
        components: [BrowserFrame, Camera]
        demo: recipe
      - id: lifecycle-rules
        narration: These handlers run synchronously inside a lock. Keep them fast, never throw, and hand slow work to a queue.
        visual: The windows shrink away; a handler card springs in inside a lock frame; a quick chip passes through it, while a slow "database" chip is diverted into a queue box beside it.
        components: [Card, Camera]
      - id: lifecycle-uses
        narration: Other packages build on lifecycle tracking too. The registry, hosted services and connectors all follow the graph this way.
        visual: The rule pills give way to three package pills that slide in from the right and settle in a row.
        components: [Card, Camera]
  - id: transactions
    title: Transactions
    beats:
      - id: tx-title
        narration: Finally, what happens when a write goes wrong.
        visual: Chapter card "Transactions" with the kicker Chapter 5.
        components: [ChapterCard]
      - id: tx-brew
        narration: Here is brew again. It checks that the machine is ready, then makes four separate writes.
        visual: The card exits; a code card with the Brew region types in; the ready check is focused, then the four assignments.
        components: [CodeCard, Camera]
        code: {file: ../../domain/Coffee/CoffeeMachine.cs, region: Brew}
      - id: tx-separate
        narration: Each write lands on its own, the moment it runs. Usually, that is exactly what you want.
        visual: The card slides left; four write chips State, Recipe, Target and Pump spring in on a timeline to the right and turn green one after another.
        components: [CodeCard, Card, Camera]
        code: {file: ../../domain/Coffee/CoffeeMachine.cs, region: Brew}
      - id: tx-ristretto
        narration: But our new ristretto asks for 97 degrees, and the boiler only accepts 85 to 96.
        visual: The chips reset to grey; the code card morphs into the Boiler region and the Range line on TargetTemperature is focused; a "Ristretto 97 °C" pill springs in beside it.
        components: [CodeCard, Card, Camera]
        code: {file: ../../domain/Coffee/Boiler.cs, region: Boiler}
      - id: tx-fail
        narration: So the third write throws. The state and the recipe name have already landed, and the pump never starts.
        visual: The timeline returns to the center; State and Recipe turn green, Target turns pink with a "validation error" pill, and Pump stays grey with a small cross.
        components: [Card, Camera]
      - id: tx-stuck-live
        narration: Here it is live. Brew a ristretto on the left machine, and the request fails.
        visual: The timeline shrinks away; the two machine windows spring in with the stuck clip; the camera leans toward the left window as Ristretto is pressed and the error line appears.
        components: [BrowserFrame, Camera]
        demo: stuck
      - id: tx-stuck
        narration: But the machine now says brewing ristretto, at zero bar, for good. It is stuck.
        hold: 0.6
        visual: The camera holds on the left headline "Brewing Ristretto" and the empty pump bar; a pink "stuck" pill springs in.
        components: [BrowserFrame, Card, Camera]
        demo: stuck
      - id: tx-why
        narration: Nothing undoes the first two writes. Every observer, and the simulator, now work with a machine in a state that should not exist.
        visual: The camera pulls back to the left window; a pink outline pulses around its headline and pump bar while the right window stays calm.
        components: [BrowserFrame, Card, Camera]
        demo: stuck
      - id: tx-context
        narration: The fix is a transaction. Transactions are opt in, so first, the context adds them with one more line.
        visual: The windows slide away; the context code card from the setup chapter returns and morphs into the ContextWithTransactions region of MachineHost.cs; the new WithTransactions line stays bright.
        components: [CodeCard, Camera]
        code: {file: sample/MachineHost.cs, region: ContextWithTransactions}
      - id: tx-async-code
        narration: Then the asynchronous brew method begins a transaction on the machine's own context, before the ready check.
        visual: The card morphs into the BrewAsync region of CoffeeMachine.cs and the tab renames; the BeginTransactionAsync lines are focused.
        components: [CodeCard, Camera]
        code: {file: ../../domain/Coffee/CoffeeMachine.cs, region: BrewAsync}
      - id: tx-subject-context
        narration: The machine reaches its context through the interceptor subject interface, so the method needs no extra parameters.
        visual: The context line is focused and the camera leans in on it.
        components: [CodeCard, Camera]
        code: {file: ../../domain/Coffee/CoffeeMachine.cs, region: BrewAsync}
      - id: tx-capture
        narration: Inside the transaction, writes are captured instead of applied. The model does not change, and nothing is published.
        visual: The card slides left with the four assignments focused; a pending box springs in on the right and the four write chips drop into it one by one, staying grey; the machine node beside it does not move.
        components: [CodeCard, Card, Camera]
        code: {file: ../../domain/Coffee/CoffeeMachine.cs, region: BrewAsync}
      - id: tx-read
        narration: Reads in the same flow see the pending values, so the ready check and every getter behave as if the writes had happened.
        visual: The ready check in the card is focused; a read arrow curves from the pending box back to a small "IsReady" chip, which shows the pending answer.
        components: [CodeCard, Card, Camera]
        code: {file: ../../domain/Coffee/CoffeeMachine.cs, region: BrewAsync}
      - id: tx-commit
        narration: Commit replays the captured writes in order, through all the interceptors. Each one lands and publishes its change then.
        visual: The CommitAsync line is focused; the chips leave the box in order, travel to the machine node and turn green, each with a small change ripple.
        components: [CodeCard, Card, Camera]
        code: {file: ../../domain/Coffee/CoffeeMachine.cs, region: BrewAsync}
      - id: tx-observers
        narration: So observers still see every step of the commit. What the transaction guarantees is all or nothing.
        visual: The four green chips line up on the timeline again; an "all or nothing" pill springs in above them.
        components: [Card, Camera]
      - id: tx-dispose
        narration: If anything throws before the commit, the using block disposes the transaction, and every captured write is discarded.
        visual: The chips return to the pending box; the Target chip turns pink, and the whole box fades out with its chips while the machine node stays untouched.
        components: [Card, Camera]
      - id: tx-exception
        narration: The validation exception still reaches the caller, so the endpoint can report the error.
        visual: An error pill rises from the faded box to an endpoint card labeled "POST /brew-async/brew/Ristretto" with "400".
        components: [Card, Camera]
      - id: tx-live-right
        narration: The right machine uses the asynchronous brew. Same ristretto, same rejection, but the machine never moved.
        hold: 0.8
        visual: The machine windows return with the stuck clip; the camera moves to the right window as Ristretto is pressed; the headline stays Ready and the error line appears.
        components: [BrowserFrame, Camera]
        demo: stuck
      - id: tx-live-espresso
        narration: Now press espresso on both. The stuck machine refuses, and the other one brews.
        hold: 1.2
        visual: The camera pulls back to both windows; the left shows a not ready error while the right turns to Brewing Espresso and its pump bar fills.
        components: [BrowserFrame, Camera]
        demo: stuck
      - id: tx-difference
        narration: Same model, same validation, one transaction. The difference is whether a failure leaves a mess behind.
        visual: The camera eases between the two windows; a pink "Brew" tag and a green "BrewAsync" tag spring in under them.
        components: [BrowserFrame, Card, Camera]
        demo: stuck
      - id: tx-rollback
        narration: Rollback mode covers failures during the commit itself. If one write fails there, the writes already applied are reverted.
        visual: The windows shrink away; the timeline returns with four green chips; the fourth turns pink and the first three slide back and turn grey in reverse order.
        components: [Card, Camera]
      - id: tx-modes
        narration: Pick rollback when the writes only make sense together, like a brew. Best effort keeps whatever succeeded.
        visual: Two mode pills, Rollback and BestEffort, spring in above the timeline; Rollback gets the highlight.
        components: [Card, Camera]
      - id: tx-lock
        narration: Transactions on one context run one at a time by default. A second brew waits until the first is done, and then finds the machine busy.
        visual: Two pending boxes stack; the second waits with a small lock icon until the first has committed, then moves forward.
        components: [Card, Camera]
      - id: tx-limits
        narration: A transaction belongs to one context and one async flow, and transactions cannot be nested.
        visual: A context ring labeled with the machine's context draws around the pending box; a second box tries to nest inside the first and bounces off with a pink flash.
        components: [Card, Camera]
  - id: recap
    title: Recap
    beats:
      - id: recap-title
        narration: Let us recap.
        hold: 0.6
        visual: Chapter card "Recap" in green tones.
        components: [ChapterCard]
      - id: recap-derived
        narration: Derived properties recalculate themselves from what they read, and publish only real changes.
        visual: The card exits; the dependency diagram returns and particles ripple from Temperature into IsReady and Status.
        components: [FlowDiagram]
      - id: recap-streams
        narration: Every write becomes a change you can observe, through the observable, a single property, or a queue.
        visual: The diagram fades into the change card with its three channel nodes fanning out and particles traveling to each.
        components: [FlowDiagram, Card]
      - id: recap-lifecycle
        narration: Lifecycle events tell you when subjects join or leave the graph.
        visual: The machine tree returns and the Ristretto node springs in with its attached pill.
        components: [FlowDiagram, Card]
      - id: recap-transactions
        narration: And a transaction makes a write of many steps land completely, or not at all.
        visual: The pending box returns with four chips that land together, and the "all or nothing" pill springs in.
        components: [Card]
      - id: recap-pointers
        narration: The connectors episode takes transactions to external systems. Happy brewing.
        hold: 1.5
        visual: A closing chapter card "Ready to track" in green tones.
        components: [ChapterCard]
