[project]
name = "video-tts"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "chatterbox-tts==0.1.7",
    "numpy",
    # perth (Chatterbox's watermarker) imports pkg_resources, which setuptools 81 removed.
    "setuptools<81",
    "soundfile>=0.13",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
